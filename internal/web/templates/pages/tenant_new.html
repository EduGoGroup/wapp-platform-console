{{ define "tenant_new.html" }}
<div class="page-narrow">
    <div class="mb-5">
        <a href="/" class="btn btn--text link-back">← Volver al listado</a>
        <h1 class="wapp-title mt-2">Dar de Alta Nueva Empresa</h1>
        <p class="wapp-subtitle">Crea el tenant en la plataforma para habilitar su operación.</p>
    </div>

    {{ if .Error }}
    <div class="wapp-snackbar wapp-snackbar--error" role="alert">
        {{ .Error }}
    </div>
    {{ end }}

    <div class="wapp-card">
        <form method="POST" action="/tenants/new" class="wapp-form-stack">
            <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">

            <div class="wapp-field">
                <label class="wapp-field__label" for="tenant-slug">Slug identificador (único, kebab-case)</label>
                <input class="wapp-field__control" type="text" id="tenant-slug" name="slug"
                       required placeholder="mi-empresa-cliente" value="{{ .Slug }}" pattern="^[a-z0-9-]+$">
                <small class="text-muted text-small">Solo minúsculas, números y guiones. Ejemplo: <code>panaderia-pedro</code></small>
            </div>

            <div class="wapp-field">
                <label class="wapp-field__label" for="tenant-name">Nombre comercial</label>
                <input class="wapp-field__control" type="text" id="tenant-name" name="display_name"
                       required placeholder="Panadería Pedro C.A." value="{{ .DisplayName }}">
            </div>

            <div class="wapp-field">
                <label class="wapp-field__label" for="tenant-plan">Plan inicial</label>
                <select class="wapp-field__control" id="tenant-plan" name="plan_id">
                    <option value="standard" selected>Standard</option>
                    <option value="enterprise">Enterprise</option>
                    <option value="pro">Pro</option>
                </select>
            </div>

            <div class="wapp-actions mt-4">
                <button type="submit" class="wapp-btn wapp-btn--filled">Crear Empresa</button>
            </div>
        </form>
    </div>
</div>
{{ end }}
